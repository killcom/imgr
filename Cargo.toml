[package]
name = "imgr"
version = "0.22.0"
edition = "2024"
description = "Windows image manager for AI-generated pictures: scores, hashtags, albums, ComfyUI prompt info"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts", "clipboard"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4"
trash = "5.3.0"
clipboard-win = "5.4.3"
fastrand = "2.5.0"
crc32fast = "1.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_Globalization", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
